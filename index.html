<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Jasmine's Birthday Invitation</title>
</head>
<body>
    <audio id="bgm" loop>
    <source src="resources/I see the light inst.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
    </audio>

   <div id="opening">
    <img id="tiara" src="resources/tiara.png">
    <img id="lily" src="resources/lily.png">
    <img id="cham" src="resources/cham.png">

    <h1>Once upon a time</h1>
    <p>A new life begins</p>
    <img id="book" src="resources/book.png">
    <img id="bookOpen" src="resources/open.png">
    <img id="textb" src="resources/text.png">

   </div>

   <div id="fade"></div>

    <div id="main">
        <div id="greet">
            <img src="resources/lantern.png" id="lantern1">
            <img src="resources/lily.png" id="lily2">
            <h2>You are Invited to:</h2>
            <h1>Jasmine</h1>
            <h2>17th Birthday party!</h2>
            <h2>6.11.26</h2>
        </div>
        <div id="details">
            <img id="butterfly" src="resources/butterfly.png">
            <div id="date">
                <h1 id="d">6</h1>
                <div id="d2">
                    <h5>November <br> 2026</h5>
                </div>
            </div>
            <img id="castle" src="resources/castle.png">
            <img id="me" src="resources/me.png">
            <h1 id="time">17:00</h1>
            <img id="lanterns" src="resources/lanterns.png">
            <img id="magic" src="resources/magic.png">
            <div id="location">
                <h1>Tulip Golden Essential</h1>
                <p>Terrace Park</p>
                <a id="map" href="https://share.google/AFPoRpLETNzC057LK">View Map</a>
            </div>
            <div id="dc">
                <p>Dresscode: Disney characters inspired</p>
                <img id="chamdress" src="resources/chamdress.png">
                <img id="rapunzel" src="resources/rapunzel.png"><br><br><br><br><br>
                <p>Wear your best outfits!
                <br>There will be the best outfit awards</p>
            </div>
            <img id="lanterns2" src="resources/lanterns.png">
            <img id="cham2" src="resources/cham2.png">
            <br><br><br><br>
            <h1 id="rsv">RSVP</h1>
            <div id="rsvp">
                <div id="form">
                    <label>Your name</label> <br>
                    <input type="text " id="name" required>
                    <br> <br>
                    <label>Are you coming?</label>
                    <br> <br>
                    <label id="choice">
                        <input type="radio" name="attendance" value="Yes">
                        Absolutely, wouldnt miss it!
                    </label>
                    <br>
                    <label id="choice">
                        <input type="radio" name="attendance" value="No">
                        Sorry! cant make it.
                    </label>
                    <br> <br>
                    <button id="reserve">RESERVE NOW</button>
                </div>
            </div>
        </div>
    </div>

   <script src="script.js"></script>
</body>
</html>
